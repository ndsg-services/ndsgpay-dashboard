<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NDSGPay — Connexion</title>
  <meta name="description" content="Connectez-vous à votre espace marchand NDSGPay." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
      --cream: #F0EDE6;
      --cream-dark: #E8E4DC;
      --cream-darker: #DDD8CF;
      --blue: #1A5FB4;
      --blue-dark: #144d96;
      --blue-light: #EAF1FB;
      --blue-mid: #C5D9F5;
      --text: #1a1a18;
      --text-mid: #3a3a36;
      --text-muted: #6b6b65;
      --border: rgba(26,26,24,0.1);
      --border-strong: rgba(26,26,24,0.18);
      --success: #1a7a3c;
      --success-bg: #eaf5ef;
      --danger: #c0392b;
      --danger-bg: #fdf0ee;
      --warning: #92600a;
      --warning-bg: #fdf5e6;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'DM Sans', sans-serif;
      --mono: 'DM Mono', monospace;
      --sidebar-w: 240px;
      --header-h: 60px;
    }
html { scroll-behavior: smooth; }
body {
      font-family: var(--sans);
      background: var(--cream);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }
#login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
    }
.login-box {
      width: 100%;
      max-width: 400px;
      padding: 48px 40px;
      background: #fff;
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.07);
    }
.login-logo {
      font-family: var(--sans);
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }
.login-logo span { color: var(--blue); }
.login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 36px; }
.form-group { margin-bottom: 16px; }
.form-label { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 7px; }
.form-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--cream);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-family: var(--sans);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
.form-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,95,180,0.1); }
.btn-login {
      width: 100%;
      padding: 11px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
.btn-login:hover { background: var(--blue-dark); }
.login-footer { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 20px; }
.login-footer a { color: var(--blue); text-decoration: none; }
@media (max-width: 600px) {
body { overflow-y: auto !important; }
}
  </style>
</head>
<body>

<div id="login-screen">
  <!-- LOGIN FORM -->
  <div class="login-box" id="box-login">
    <div class="login-logo">NDSG<span>Pay</span></div>
    <div class="login-sub">Connectez-vous à votre espace marchand</div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" id="login-email" placeholder="vous@entreprise.com" autocomplete="username" />
    </div>
    <div class="form-group">
      <label class="form-label">Mot de passe</label>
      <input type="password" class="form-input" id="login-pass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">Se connecter</button>

    <div class="login-footer">
      Pas encore de compte ? <a href="#" onclick="showRegister(); return false;">Créer un compte</a><br />
      <a href="/docs.html">Documentation API</a>
    </div>
  </div>

  <!-- REGISTER FORM -->
  <div class="login-box" id="box-register" style="display:none">
    <div class="login-logo">NDSG<span>Pay</span></div>
    <div class="login-sub">Créez votre espace marchand</div>

    <div class="form-group">
      <label class="form-label">Nom de l'entreprise *</label>
      <input type="text" class="form-input" id="reg-company" placeholder="ACME SARL" />
    </div>
    <div class="form-group">
      <label class="form-label">Votre nom complet *</label>
      <input type="text" class="form-input" id="reg-name" placeholder="Jean Dupont" />
    </div>
    <div class="form-group">
      <label class="form-label">Email professionnel *</label>
      <input type="email" class="form-input" id="reg-email" placeholder="vous@entreprise.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Numéro de téléphone</label>
      <input type="tel" class="form-input" id="reg-phone" placeholder="+241 77 000 000" />
    </div>
    <div class="form-group">
      <label class="form-label">Mot de passe *</label>
      <input type="password" class="form-input" id="reg-pass" placeholder="Minimum 8 caractères" />
    </div>
    <div class="form-group">
      <label class="form-label">Confirmer le mot de passe *</label>
      <input type="password" class="form-input" id="reg-pass2" placeholder="••••••••" />
    </div>
    <button class="btn-login" id="btn-register" onclick="doRegister()">Créer mon compte</button>
    <div id="reg-error" style="display:none;font-size:13px;color:#c0392b;background:#fdf0ee;padding:10px 14px;border-radius:8px;margin-top:12px;text-align:center"></div>

    <div class="login-footer">
      Déjà un compte ? <a href="#" onclick="showLogin(); return false;">Se connecter</a>
    </div>
  </div>
</div>

<script>
  const API = 'https://ndsgpay-backend.vercel.app/api';

  // Point d'entrée unique des redirections (la valeur par défaut est la vraie navigation)
  function navigate(url) {
    (window.__ndsgNavigate || function (u) { window.location.replace(u); })(url);
  }
  function goToApp() { navigate('/app.html'); }

  function saveSession(data) {
    sessionStorage.setItem('ndsgpay_jwt', data.token);
    sessionStorage.setItem('ndsgpay_merchant', JSON.stringify(data.merchant));
    sessionStorage.setItem('ndsgpay_user', JSON.stringify(data.user));
  }

  // ── LOGIN ────────────────────────────────────────────────────
  async function doLogin() {
    const email = document.getElementById('login-email').value;
    const pass  = document.getElementById('login-pass').value;
    if (!email || !pass) return;

    const btn = document.getElementById('btn-login');
    btn.textContent = 'Connexion...';
    btn.disabled = true;

    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass })
      });
      const data = await res.json();

      if (!data.success) {
        showLoginError(data.error || 'Email ou mot de passe incorrect');
        btn.textContent = 'Se connecter';
        btn.disabled = false;
        return;
      }

      saveSession(data);
      goToApp();

    } catch (err) {
      showLoginError('Erreur de connexion. Réessayez.');
      btn.textContent = 'Se connecter';
      btn.disabled = false;
    }
  }

  function showLoginError(msg) {
    let el = document.getElementById('login-error');
    if (!el) {
      el = document.createElement('div');
      el.id = 'login-error';
      el.style.cssText = 'font-size:13px;color:#c0392b;background:#fdf0ee;padding:10px 14px;border-radius:8px;margin-top:12px;text-align:center';
      document.getElementById('btn-login').after(el);
    }
    el.textContent = msg;
  }

  // ── REGISTER ─────────────────────────────────────────────────
  function showRegister() {
    document.getElementById('box-login').style.display = 'none';
    document.getElementById('box-register').style.display = 'block';
    document.getElementById('reg-error').style.display = 'none';
  }

  function showLogin() {
    document.getElementById('box-register').style.display = 'none';
    document.getElementById('box-login').style.display = 'block';
  }

  async function doRegister() {
    const companyName = document.getElementById('reg-company').value.trim();
    const name        = document.getElementById('reg-name').value.trim();
    const email       = document.getElementById('reg-email').value.trim();
    const phone       = document.getElementById('reg-phone').value.trim();
    const pass        = document.getElementById('reg-pass').value;
    const pass2       = document.getElementById('reg-pass2').value;

    const errEl = document.getElementById('reg-error');
    errEl.style.display = 'none';

    if (!companyName || !name || !email || !pass) {
      errEl.style.display = 'block';
      errEl.textContent = 'Veuillez remplir tous les champs obligatoires.';
      return;
    }
    if (pass.length < 8) {
      errEl.style.display = 'block';
      errEl.textContent = 'Le mot de passe doit contenir au moins 8 caractères.';
      return;
    }
    if (pass !== pass2) {
      errEl.style.display = 'block';
      errEl.textContent = 'Les mots de passe ne correspondent pas.';
      return;
    }

    const btn = document.querySelector('#box-register .btn-login');
    btn.textContent = 'Création en cours...';
    btn.disabled = true;

    try {
      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ companyName, name, email, phone, password: pass })
      });
      const data = await res.json();

      if (!data.success) {
        errEl.style.display = 'block';
        errEl.textContent = data.error || 'Erreur lors de la création du compte.';
        btn.textContent = 'Créer mon compte';
        btn.disabled = false;
        return;
      }

      // Succès — connecter directement
      saveSession(data);
      goToApp();

    } catch (err) {
      errEl.style.display = 'block';
      errEl.textContent = 'Erreur réseau. Réessayez.';
      btn.textContent = 'Créer mon compte';
      btn.disabled = false;
    }
  }

  // Entrée au clavier sur le formulaire de connexion
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('box-login').style.display !== 'none') {
      doLogin();
    }
  });

  window.addEventListener('DOMContentLoaded', () => {
    // Déjà connecté : l'application vérifie la session (et revient ici si elle est invalide)
    if (sessionStorage.getItem('ndsgpay_jwt')) { goToApp(); return; }
    if (new URLSearchParams(window.location.search).get('session') === 'expired') {
      showLoginError('Votre session a expiré. Veuillez vous reconnecter.');
    }
  });
</script>
</body>
</html>
