<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NDSGPay — Accepter l'invitation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --cream: #f8f6f1;
      --white: #ffffff;
      --danger: #dc2626;
      --success: #16a34a;
      --sans: 'Inter', system-ui, sans-serif;
    }
    body {
      font-family: var(--sans);
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--white);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .logo span { color: var(--blue); }
    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--sans);
      color: var(--text);
      background: var(--white);
      outline: none;
      transition: border-color .15s;
    }
    .form-input:focus { border-color: var(--blue); }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--sans);
      cursor: pointer;
      margin-top: 8px;
      transition: background .15s;
    }
    .btn:hover { background: var(--blue-dark); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .msg {
      font-size: 12px;
      margin-top: 12px;
      text-align: center;
      display: none;
    }
    .msg.error { color: var(--danger); display: block; }
    .msg.success { color: var(--success); display: block; }
    .invite-info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--text);
    }
    .invite-info strong { color: var(--blue); }
  </style>
</head>
<body>
<div class="card" id="card-form">
  <div class="logo">NDSG<span>Pay</span></div>
  <div class="subtitle">Vous avez été invité à rejoindre un espace marchand.</div>

  <div class="invite-info" id="invite-info">Chargement de l'invitation...</div>

  <div class="form-group">
    <label class="form-label">Votre nom</label>
    <input type="text" id="inv-name" class="form-input" placeholder="Prénom Nom"/>
  </div>
  <div class="form-group">
    <label class="form-label">Choisir un mot de passe</label>
    <input type="password" id="inv-password" class="form-input" placeholder="••••••••" autocomplete="new-password"/>
  </div>
  <div class="form-group">
    <label class="form-label">Confirmer le mot de passe</label>
    <input type="password" id="inv-confirm" class="form-input" placeholder="••••••••" autocomplete="new-password"/>
  </div>
  <button class="btn" id="inv-btn" onclick="acceptInvite()">Créer mon compte</button>
  <div class="msg" id="inv-msg"></div>
</div>

<div class="card" id="card-success" style="display:none;text-align:center">
  <div class="logo" style="margin-bottom:16px">NDSG<span>Pay</span></div>
  <div style="font-size:40px;margin-bottom:12px">✓</div>
  <div style="font-size:16px;font-weight:600;color:var(--success);margin-bottom:8px">Compte créé avec succès</div>
  <div style="font-size:13px;color:var(--text-muted);margin-bottom:24px">Vous pouvez maintenant vous connecter au dashboard.</div>
  <a href="/" style="display:block;padding:12px;background:var(--blue);color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px">Se connecter</a>
</div>

<script>
  const API = 'https://ndsgpay-backend.vercel.app/api';
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (!token) {
    document.getElementById('invite-info').textContent = 'Lien d\'invitation invalide.';
    document.getElementById('invite-info').style.background = '#fef2f2';
    document.getElementById('invite-info').style.borderColor = '#fecaca';
    document.getElementById('inv-btn').disabled = true;
  } else {
    // Charger les infos de l'invitation
    fetch(`${API}/team/invite-info?token=${token}`)
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          document.getElementById('invite-info').innerHTML =
            `Vous êtes invité(e) à rejoindre <strong>${data.merchantName}</strong> en tant que <strong>${data.role}</strong>.`;
          if (data.email) {
            document.getElementById('invite-info').innerHTML +=
              `<br/><span style="font-size:12px;color:var(--text-muted)">${data.email}</span>`;
          }
        } else {
          document.getElementById('invite-info').textContent = data.error || 'Invitation invalide ou expirée.';
          document.getElementById('invite-info').style.background = '#fef2f2';
          document.getElementById('invite-info').style.borderColor = '#fecaca';
          document.getElementById('inv-btn').disabled = true;
        }
      })
      .catch(() => {
        document.getElementById('invite-info').textContent = 'Impossible de charger l\'invitation.';
      });
  }

  async function acceptInvite() {
    const btn  = document.getElementById('inv-btn');
    const msg  = document.getElementById('inv-msg');
    const name = document.getElementById('inv-name').value.trim();
    const pwd  = document.getElementById('inv-password').value;
    const conf = document.getElementById('inv-confirm').value;

    msg.className = 'msg';

    if (!pwd || !conf) { msg.className = 'msg error'; msg.textContent = 'Veuillez remplir tous les champs.'; return; }
    if (pwd !== conf)  { msg.className = 'msg error'; msg.textContent = 'Les mots de passe ne correspondent pas.'; return; }
    if (pwd.length < 8) { msg.className = 'msg error'; msg.textContent = 'Le mot de passe doit contenir au moins 8 caractères.'; return; }

    btn.disabled = true;
    btn.textContent = 'Création du compte...';

    try {
      const res = await fetch(`${API}/team/accept`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pwd, name })
      });
      const data = await res.json();

      if (data.success) {
        document.getElementById('card-form').style.display = 'none';
        document.getElementById('card-success').style.display = 'block';
      } else {
        msg.className = 'msg error';
        msg.textContent = data.error || 'Erreur lors de la création du compte.';
        btn.disabled = false;
        btn.textContent = 'Créer mon compte';
      }
    } catch (e) {
      msg.className = 'msg error';
      msg.textContent = 'Erreur réseau.';
      btn.disabled = false;
      btn.textContent = 'Créer mon compte';
    }
  }
</script>
</body>
</html>
